
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava5
  template:
    metadata:
      labels:
        app: simplejava5
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava5:latest
          imagePullPolicy: Always
