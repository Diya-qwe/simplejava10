
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava4
  template:
    metadata:
      labels:
        app: simplejava4
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava4:latest
          imagePullPolicy: Always
