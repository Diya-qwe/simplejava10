
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava10
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava10
  template:
    metadata:
      labels:
        app: simplejava10
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava10:latest
          imagePullPolicy: Always
