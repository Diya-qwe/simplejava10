
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava3
  template:
    metadata:
      labels:
        app: simplejava3
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava3:latest
          imagePullPolicy: Always
