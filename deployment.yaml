
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava
  template:
    metadata:
      labels:
        app: simplejava
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava:latest
          imagePullPolicy: Always
