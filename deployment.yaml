
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava7
  template:
    metadata:
      labels:
        app: simplejava7
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava7:latest
          imagePullPolicy: Always
